<!doctype html>
<html>
  <body>
    <script>
      // Reads, writes or removes one localStorage item for the Streamlit app.
      // Streamlit components share the app's origin, so this is the app's own storage.
      function send(type, data) {
        window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type: type }, data), "*");
      }

      let lastRequest = null;
      window.addEventListener("message", function (event) {
        if (event.data.type !== "streamlit:render") return;
        const args = event.data.args;
        // Streamlit re-sends the args on every rerun; act on each request only once.
        const request = JSON.stringify([args.action, args.name, args.value]);
        if (request === lastRequest) return;
        lastRequest = request;

        let value = "";
        try {
          if (args.action === "get") value = window.localStorage.getItem(args.name) || "";
          else if (args.action === "set") window.localStorage.setItem(args.name, args.value);
          else if (args.action === "remove") window.localStorage.removeItem(args.name);
        } catch (e) {
          // Storage can be blocked (private browsing, strict settings): behave as if empty.
        }
        // Only reads report back; a reply makes Streamlit rerun the app.
        if (args.action === "get") send("streamlit:setComponentValue", { value: value, dataType: "json" });
      });

      send("streamlit:componentReady", { apiVersion: 1 });
      send("streamlit:setFrameHeight", { height: 0 });
    </script>
  </body>
</html>
